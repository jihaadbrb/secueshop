name: Security Pipeline
on: [push, pull_request]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Run Gitleaks - detect secrets
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --source . --redact -v --exit-code=1
      - name: Run Semgrep - code scanning
        run: |
          pip install semgrep
          cat > /tmp/custom-rules.yml << 'EOF'
          rules:
            - id: laravel-sql-injection
              pattern: |
                DB::select("$QUERY")
              message: "SQL Injection vulnerability - use parameterized queries instead of string interpolation"
              languages: [php]
              severity: ERROR
            - id: laravel-sql-injection-2
              pattern: |
                DB::select("...$...")
              message: "SQL Injection vulnerability detected"
              languages: [php]
              severity: ERROR
            - id: php-xss
              pattern: '{!! $... !!}'
              message: "XSS vulnerability - use {{ }} instead of {!! !!}"
              languages: [generic]
              severity: ERROR
          EOF
          semgrep scan --config /tmp/custom-rules.yml --error .
      - name: Run Trivy - dependency scanning
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Start Laravel app for ZAP scan
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan serve --host=0.0.0.0 --port=8000 &
          sleep 10
      - name: Run OWASP ZAP - baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8000/'
          allow_issue_writing: false
          fail_action: false
